services:
  db:
    image: mariadb:11.4
    restart: on-failure
    user: root
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file: .env
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    networks:
      - node-mariadb-app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    restart: on-failure
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      PMA_HOST: db
    networks:
      - node-mariadb-app

networks:
  node-mariadb-app:
    driver: bridge

volumes:
  mariadb_data: {}